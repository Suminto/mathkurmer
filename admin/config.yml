backend:
  name: github
  repo: Suminto/mathkurmer
  branch: main
  base_url: https://mathkurmer-oauth-proxy.pasuminto.workers.dev
  auth_endpoint: auth

media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "domain_desc"
    label: "Deskripsi Domain (Home)"
    label_singular: "Deskripsi Domain"
    files:
      - name: "bilangan"
        label: "Bilangan"
        file: "content/domain-desc/bilangan.md"
        fields:
          - { label: "Deskripsi Singkat", name: "deskripsiSingkat", widget: "string" }
      - name: "aljabar"
        label: "Aljabar"
        file: "content/domain-desc/aljabar.md"
        fields:
          - { label: "Deskripsi Singkat", name: "deskripsiSingkat", widget: "string" }
      - name: "pengukuran"
        label: "Pengukuran"
        file: "content/domain-desc/pengukuran.md"
        fields:
          - { label: "Deskripsi Singkat", name: "deskripsiSingkat", widget: "string" }
      - name: "geometri"
        label: "Geometri"
        file: "content/domain-desc/geometri.md"
        fields:
          - { label: "Deskripsi Singkat", name: "deskripsiSingkat", widget: "string" }
      - name: "analisis-data-peluang"
        label: "Analisis Data dan Peluang"
        file: "content/domain-desc/analisis-data-peluang.md"
        fields:
          - { label: "Deskripsi Singkat", name: "deskripsiSingkat", widget: "string" }

  - name: "pages"
    label: "Halaman (Home & About)"
    label_singular: "Halaman"
    files:
      - name: "home"
        label: "Home"
        file: "content/pages/home.md"
        fields:
          - { label: "Label Kecil di Atas Judul", name: "eyebrow", widget: "string" }
          - { label: "Judul Utama", name: "judul", widget: "string" }
          - { label: "Sub-judul (Lede)", name: "lede", widget: "string" }
          - label: "Isi Paragraf"
            name: "isi"
            widget: "markdown"
            hint: "Rumus matematika: \\(x+y\\) (inline) atau \\[x+y\\] (berdiri sendiri)."
      - name: "about"
        label: "About"
        file: "content/pages/about.md"
        fields:
          - { label: "Label Kecil di Atas Judul", name: "eyebrow", widget: "string" }
          - { label: "Judul Utama", name: "judul", widget: "string" }
          - label: "Isi Paragraf"
            name: "isi"
            widget: "markdown"
            hint: "Rumus matematika: \\(x+y\\) (inline) atau \\[x+y\\] (berdiri sendiri)."
          - { label: "Baris Kredit di Bawah", name: "creditLine", widget: "string" }

  - name: "materi"
    label: "Materi (Domain x Fase)"
    label_singular: "Halaman Fase"
    files:
      - name: "bilangan-a"
        label: "Bilangan — Fase A"
        file: "content/bilangan/fase-a.md"
        fields:
          - { label: "Domain (jangan diubah)", name: "domain", widget: "hidden", default: "bilangan" }
          - { label: "Fase (jangan diubah)", name: "fase", widget: "hidden", default: "A" }
          - label: "Deskripsi Singkat Fase"
            name: "deskripsi"
            widget: "markdown"
            required: false
            hint: "Ringkasan singkat isi Fase ini. Untuk rumus matematika, tulis seperti biasa: \\(x+y\\) untuk rumus di tengah kalimat, atau \\[x+y\\] untuk rumus berdiri sendiri."
          - label: "Daftar Bab"
            name: "bab"
            widget: "list"
            required: false
            label_singular: "Bab"
            summary: "{{judul}}"
            fields:
              - { label: "Judul Bab", name: "judul", widget: "string", hint: "Contoh: Bab 1: Bilangan Bulat" }
              - label: "Ringkasan Materi"
                name: "ringkasan"
                widget: "markdown"
                hint: "Materi singkat Bab ini. Rumus matematika: \\(x+y\\) (inline) atau \\[x+y\\] (berdiri sendiri)."
              - { label: "Link Ebook Interaktif (opsional)", name: "ebookUrl", widget: "string", required: false, hint: "Contoh: /ebooks/nama-file.html — upload file ebook ke folder src/ebooks/ lewat GitHub, lalu isi nama filenya di sini" }
              - { label: "Teks Tombol Ebook (opsional)", name: "ebookLabel", widget: "string", required: false, default: "Buka Ebook Interaktif" }

      - name: "bilangan-b"
        label: "Bilangan — Fase B"
